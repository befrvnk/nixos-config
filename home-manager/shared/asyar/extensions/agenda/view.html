<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda</title>
  <style>
    :root {
      --bg: transparent;
      --bg-surface: var(--bg-secondary, rgba(255, 255, 255, 0.06));
      --bg-hover: var(--bg-hover, rgba(255, 255, 255, 0.12));
      --text: var(--text-primary, #ffffff);
      --text-muted: var(--text-secondary, rgba(255, 255, 255, 0.65));
      --text-on-accent: var(--text-on-accent, #ffffff);
      --accent: var(--accent-primary, #89b4fa);
      --accent-green: var(--accent-success, #a6e3a1);
      --border: var(--border-color, rgba(255, 255, 255, 0.12));
      --radius: var(--radius-md, 8px);
      --radius-sm: var(--radius-sm, 6px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: transparent;
      color: var(--text);
      padding: 16px;
      height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .today-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .actions-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      background: var(--bg-surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s ease;
    }

    button:hover {
      background: var(--bg-hover);
    }

    .search-box {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      font-size: 13px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-box:focus {
      border-color: var(--accent);
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin: 12px 0 6px 4px;
      font-weight: 600;
    }

    .event-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .event-card:hover, .event-card.selected {
      background: var(--bg-hover);
      border-color: var(--accent);
    }

    .event-card.happening-now {
      border-left: 3px solid var(--accent-green);
    }

    .event-main {
      flex: 1;
      min-width: 0;
    }

    .event-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .event-meta {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .event-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-now {
      background: rgba(166, 227, 161, 0.15);
      color: var(--accent-green);
      border: 1px solid rgba(166, 227, 161, 0.3);
    }

    .badge-soon {
      background: rgba(137, 180, 250, 0.15);
      color: var(--accent);
      border: 1px solid rgba(137, 180, 250, 0.3);
    }

    .join-btn {
      background: var(--bg-surface);
      color: var(--text);
      font-weight: 500;
      padding: 5px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      font-size: 11px;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    button.join-btn:hover {
      background: var(--accent) !important;
      color: var(--text-on-accent) !important;
      border-color: var(--accent) !important;
    }

    button.join-btn:active {
      opacity: 0.85;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .empty-state p {
      margin-bottom: 12px;
    }

    .config-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .config-panel.open {
      display: flex;
    }

    .config-panel textarea {
      width: 100%;
      height: 80px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 8px;
      font-size: 12px;
      font-family: monospace;
      outline: none;
      resize: vertical;
    }

    .config-panel textarea:focus {
      border-color: var(--accent);
    }

    .status-badge {
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <div class="today-title" id="date-heading">📅 Upcoming Agenda</div>
    <div class="actions-bar">
      <span class="status-badge" id="sync-status"></span>
      <button id="btn-refresh" title="Refresh (⌘R)">🔄 Refresh</button>
      <button id="btn-config" title="Configure Calendar URLs">⚙️ Feeds</button>
    </div>
  </div>

  <div class="config-panel" id="config-panel">
    <div style="font-size: 12px; font-weight: 600;">Calendar iCal / ICS URLs</div>
    <div style="font-size: 11px; color: var(--text-muted);">
      One or more iCal / webcal subscription URLs (Google Calendar, iCloud, Outlook, Fastmail).
    </div>
    <textarea id="input-urls" placeholder="https://calendar.google.com/calendar/ical/.../basic.ics&#10;webcal://p01-caldav.icloud.com/..."></textarea>
    <div style="display: flex; justify-content: flex-end; gap: 8px;">
      <button id="btn-cancel-config">Cancel</button>
      <button id="btn-save-config" style="background: var(--accent); color: #ffffff; font-weight: 600;">Save Feeds</button>
    </div>
  </div>

  <input type="text" class="search-box" id="search-input" placeholder="Search events..." />

  <div id="events-container">
    <div class="empty-state">
      <p>Loading your calendar...</p>
    </div>
  </div>

  <script src="./view.js"></script>
</body>
</html>
