<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Theme</title>
  <style>
    :root {
      --bg: transparent;
      --bg-surface: var(--bg-secondary, rgba(255, 255, 255, 0.06));
      --bg-hover: var(--bg-hover, rgba(255, 255, 255, 0.12));
      --text: var(--text-primary, #ffffff);
      --text-muted: var(--text-secondary, rgba(255, 255, 255, 0.65));
      --text-on-accent: var(--text-on-accent, #ffffff);
      --accent: var(--accent-primary, #89b4fa);
      --border: var(--border-color, rgba(255, 255, 255, 0.12));
      --radius: var(--radius-md, 8px);
      --radius-sm: var(--radius-sm, 6px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: transparent;
      color: var(--text);
      padding: 24px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .theme-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      min-width: 260px;
      text-align: center;
    }

    .icon-display {
      font-size: 40px;
      margin-bottom: 4px;
    }

    .theme-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .theme-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }

    .button-group {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    button {
      background: var(--bg-surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    button:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--text-on-accent);
    }

    button:active {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="theme-card">
    <div class="icon-display" id="theme-icon">🌓</div>
    <div class="theme-title" id="theme-title">Toggling System Theme...</div>
    <div class="theme-subtitle" id="theme-status">Applying appearance changes</div>
    <div class="button-group">
      <button id="btn-toggle">🌓 Toggle</button>
      <button id="btn-dark">🌙 Dark</button>
      <button id="btn-light">☀️ Light</button>
    </div>
  </div>

  <script src="./view.js"></script>
</body>
</html>
